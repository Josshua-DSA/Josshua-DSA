<svg xmlns="http://www.w3.org/2000/svg" width="260" height="68" viewBox="0 0 260 68" role="img" aria-label="Instagram">
  <defs>
    <radialGradient id="cardBgIg" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#1c1c21"/>
      <stop offset="100%" stop-color="#121215"/>
    </radialGradient>
    <style>
      .label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: 1px;
        fill: #ffffff;
      }
      .sublabel {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        letter-spacing: 1px;
        fill: #a1a1aa;
      }
    </style>
  </defs>

  <!-- Card Body -->
  <rect x="1" y="1" width="258" height="66" rx="10" fill="url(#cardBgIg)" stroke="#27272a" stroke-width="1"/>

  <!-- Instagram Icon -->
  <g transform="translate(20, 22)">
    <rect x="0" y="0" width="24" height="24" rx="4" fill="#27272a"/>
    <rect x="4.5" y="4.5" width="15" height="15" rx="4" fill="none" stroke="#ffffff" stroke-width="1.6"/>
    <circle cx="12" cy="12" r="3.5" fill="none" stroke="#ffffff" stroke-width="1.6"/>
    <circle cx="16" cy="8" r="0.9" fill="#ffffff"/>
  </g>

  <!-- Text -->
  <text x="56" y="32" class="label">INSTAGRAM</text>
  <text x="56" y="47" class="sublabel">@jojieeezz</text>

  <!-- Arrow -->
  <g stroke="#71717a" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M228 34h-10M223 29l5 5-5 5"/>
  </g>
</svg>
