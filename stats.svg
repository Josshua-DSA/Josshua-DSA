<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="metricBg" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="45%" stop-color="#0e0e11"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="metricGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#71717a" fill-opacity="0.10"/>
    </pattern>

    <!-- Top Shimmer Border -->
    <linearGradient id="metricTopGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#71717a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.2"/>
    </linearGradient>

    <style>
      .metric-eyebrow {
        font-family: 'JetBrains Mono', 'Geist Mono', monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 3px;
        fill: #a1a1aa;
      }
      .card-title {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #71717a;
      }
      .metric-value {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.5px;
        fill: #ffffff;
      }
      .metric-desc {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.5px;
        fill: #a1a1aa;
      }
    </style>
  </defs>

  <!-- Container Base -->
  <rect x="0" y="0" width="900" height="200" rx="14" fill="url(#metricBg)"/>
  <rect x="0" y="0" width="900" height="200" rx="14" fill="url(#metricGrid)"/>
  <rect x="1" y="1" width="898" height="198" rx="13" fill="none" stroke="#27272a" stroke-width="1"/>
  <path d="M 14 1 L 886 1" stroke="url(#metricTopGlow)" stroke-width="1.2"/>

  <!-- Eyebrow -->
  <text x="450" y="32" text-anchor="middle" class="metric-eyebrow">// OPERATIONAL PROFILE &amp; PRACTICE MATRIX</text>

  <!-- 3 Modular Columns -->
  <!-- Col 1 -->
  <g transform="translate(24, 48)">
    <rect x="0" y="0" width="270" height="128" rx="8" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="16" y="26" class="card-title">01 // CORE FOCUS</text>
    <line x1="16" y1="36" x2="254" y2="36" stroke="#27272a" stroke-width="1"/>
    <text x="16" y="62" class="metric-value">End-to-End Data Lifecycle</text>
    <text x="16" y="84" class="metric-desc">Distributed Pipelines &amp; ETL</text>
    <text x="16" y="104" class="metric-desc">Scalable ML Infrastructure</text>
  </g>

  <!-- Col 2 -->
  <g transform="translate(315, 48)">
    <rect x="0" y="0" width="270" height="128" rx="8" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="16" y="26" class="card-title">02 // PRIMARY ECOSYSTEM</text>
    <line x1="16" y1="36" x2="254" y2="36" stroke="#27272a" stroke-width="1"/>
    <text x="16" y="62" class="metric-value">Python · SQL · Spark</text>
    <text x="16" y="84" class="metric-desc">MLflow · DVC · PyTorch</text>
    <text x="16" y="104" class="metric-desc">PostgreSQL · Docker · Linux</text>
  </g>

  <!-- Col 3 -->
  <g transform="translate(606, 48)">
    <rect x="0" y="0" width="270" height="128" rx="8" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="16" y="26" class="card-title">03 // ENGINEERING STANDARDS</text>
    <line x1="16" y1="36" x2="254" y2="36" stroke="#27272a" stroke-width="1"/>
    <text x="16" y="62" class="metric-value">CI/CD &amp; Versioned Models</text>
    <text x="16" y="84" class="metric-desc">Automated Data Testing</text>
    <text x="16" y="104" class="metric-desc">Production Health Monitoring</text>
  </g>
</svg>
