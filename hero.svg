<svg width="900" height="380" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  .name { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; font-size: 42px; letter-spacing: 5px; fill: #ffffff; }
  .sub { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 1.5px; fill: #00f0ff; }
  .ach { font-family: 'Fira Code', monospace; font-weight: 700; font-size: 16px; fill: #ffb703; }
  .status-text { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; font-size: 14px; letter-spacing: 2px; fill: #ffffff; }
  .corner { stroke: #00f0ff; stroke-width: 2.5; fill: none; opacity: .9; }
  .glowbar { animation: pulse 2.6s ease-in-out infinite; }
  .trace { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 30 250; animation: travel 3.2s linear infinite; }
  @keyframes travel { to { stroke-dashoffset: -400; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  @keyframes scan { 0% { transform: translateY(-40px); } 100% { transform: translateY(400px); } }
  @keyframes glitch {
    0%, 92%, 100% { transform: translate(0,0); opacity: 0; }
    93% { transform: translate(-3px,1px); opacity: .85; }
    95% { transform: translate(3px,-1px); opacity: .85; }
    97% { transform: translate(-2px,0); opacity: .65; }
  }
  .clip1 rect { animation: type1 12s infinite; }
  .clip2 rect { animation: type2 12s infinite; }
  .clip3 rect { animation: type3 12s infinite; }
  @keyframes type1 { 0%{width:0} 3%{width:0} 11%{width:330px} 27%{width:330px} 33%{width:0} 100%{width:0} }
  @keyframes type2 { 0%{width:0} 33%{width:0} 36%{width:0} 44%{width:290px} 60%{width:290px} 66%{width:0} 100%{width:0} }
  @keyframes type3 { 0%{width:0} 66%{width:0} 69%{width:0} 77%{width:365px} 95%{width:365px} 100%{width:0} }
</style>

<!-- Triadic Deep Navy Background -->
<radialGradient id="bgGrad3" cx="50%" cy="20%" r="90%">
  <stop offset="0%" stop-color="#0a192f"/>
  <stop offset="50%" stop-color="#030c1b"/>
  <stop offset="100%" stop-color="#010610"/>
</radialGradient>

<radialGradient id="vignette3" cx="50%" cy="50%" r="75%">
  <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
  <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
</radialGradient>

<!-- Triadic Frame: Cyan (#00f0ff) + Magenta (#f72585) + Amber Gold (#ffb703) -->
<linearGradient id="frameGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#00f0ff"><animate attributeName="stop-color" values="#00f0ff;#f72585;#ffb703;#00f0ff" dur="7s" repeatCount="indefinite"/></stop>
  <stop offset="100%" stop-color="#f72585"><animate attributeName="stop-color" values="#f72585;#ffb703;#00f0ff;#f72585" dur="7s" repeatCount="indefinite"/></stop>
</linearGradient>

<linearGradient id="scanGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.12"/>
  <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
</linearGradient>

<filter id="glow3" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="5" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="softglow3" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="12" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>

<rect x="0" y="0" width="900" height="380" rx="18" fill="url(#bgGrad3)"/>
<rect x="0" y="0" width="900" height="380" rx="18" fill="url(#vignette3)"/>
<rect x="3" y="3" width="894" height="374" rx="16" fill="none" stroke="url(#frameGrad3)" stroke-width="2.5" opacity="0.8"/>

<path class="corner" d="M24 60 L24 24 L60 24"/>
<path class="corner" d="M876 60 L876 24 L840 24"/>
<path class="corner" d="M24 320 L24 356 L60 356"/>
<path class="corner" d="M876 320 L876 356 L840 356"/>

<rect x="0" y="0" width="900" height="40" fill="url(#scanGrad3)" style="animation: scan 6s linear infinite;"/>

<!-- High Contrast White Name with Cyan & Magenta Glitch Shadows -->
<text x="450" y="110" text-anchor="middle" class="name" filter="url(#softglow3)">JOSHUA REMEDIAL SYEBA</text>
<text x="447" y="110" text-anchor="middle" class="name" fill="#00f0ff" style="animation: glitch 7s infinite;">JOSHUA REMEDIAL SYEBA</text>
<text x="453" y="110" text-anchor="middle" class="name" fill="#f72585" style="animation: glitch 7s infinite .1s;">JOSHUA REMEDIAL SYEBA</text>

<text x="450" y="146" text-anchor="middle" class="sub">DATA SCIENCE · DATA ENGINEERING · ANALYTICS · MLOPS</text>

<rect class="glowbar" x="380" y="164" width="140" height="2.5" fill="#ffb703" filter="url(#glow3)"/>

<clipPath id="clip1" class="clip1"><rect x="287" y="215" width="0" height="30"/></clipPath>
<clipPath id="clip2" class="clip2"><rect x="308" y="215" width="0" height="30"/></clipPath>
<clipPath id="clip3" class="clip3"><rect x="271" y="215" width="0" height="30"/></clipPath>

<!-- Triadic Amber Gold Highlight for Typing Achievements -->
<text x="287" y="235" text-anchor="start" class="ach" clip-path="url(#clip1)">DATA ANALYTICS &amp; VISUALIZATION</text>
<text x="308" y="235" text-anchor="start" class="ach" clip-path="url(#clip2)">DATA ENGINEERING &amp; BIG DATA</text>
<text x="271" y="235" text-anchor="start" class="ach" clip-path="url(#clip3)">MACHINE LEARNING &amp; MLOPS PIPELINES</text>

<g>
<rect x="356" y="280" width="188" height="42" rx="10" fill="#041b33" stroke="#00f0ff" stroke-width="1.6" filter="url(#glow3)"/>
<rect class="trace" x="356" y="280" width="188" height="42" rx="10" stroke="#00f0ff"/>
<circle cx="378" cy="301" r="4" fill="#00ff87"/>
<text x="454" y="306" text-anchor="middle" class="status-text">OPEN TO WORK</text>
</g>
</svg>
