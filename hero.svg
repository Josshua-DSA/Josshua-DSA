<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="heroBg" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="45%" stop-color="#0e0e11"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>

    <!-- Top Border Ambient Light -->
    <linearGradient id="topGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.2"/>
      <stop offset="35%" stop-color="#71717a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#71717a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#71717a" fill-opacity="0.12"/>
    </pattern>

    <!-- Subtle Glow Filter for Status Indicator -->
    <filter id="emeraldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .eyebrow {
        font-family: 'JetBrains Mono', 'Geist Mono', 'Fira Code', ui-monospace, monospace;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 3px;
        fill: #a1a1aa;
      }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Geist', 'Helvetica Neue', sans-serif;
        font-size: 38px;
        font-weight: 800;
        letter-spacing: 4px;
        fill: #ffffff;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Geist', sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 2.5px;
        fill: #71717a;
      }
      .pill-text {
        font-family: 'JetBrains Mono', 'Geist Mono', monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #e4e4e7;
      }
      .meta-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 1px;
        fill: #71717a;
      }
      .pulse-dot {
        animation: pulse 2.4s ease-in-out infinite;
      }
      .shimmer-line {
        animation: shimmer 6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.9); }
      }
      @keyframes shimmer {
        0% { opacity: 0.3; }
        50% { opacity: 0.85; }
        100% { opacity: 0.3; }
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="0" y="0" width="900" height="320" rx="14" fill="url(#heroBg)"/>
  <rect x="0" y="0" width="900" height="320" rx="14" fill="url(#dotGrid)"/>

  <!-- Hairline Perimeter Border -->
  <rect x="1" y="1" width="898" height="318" rx="13" fill="none" stroke="#27272a" stroke-width="1"/>

  <!-- Top Ambient Shimmer Border -->
  <path d="M 14 1 L 886 1" stroke="url(#topGlow)" stroke-width="1.5" class="shimmer-line"/>

  <!-- Corner Precision Crosshairs -->
  <g stroke="#3f3f46" stroke-width="1" opacity="0.6">
    <!-- Top Left -->
    <line x1="20" y1="24" x2="28" y2="24"/>
    <line x1="24" y1="20" x2="24" y2="28"/>
    <!-- Top Right -->
    <line x1="872" y1="24" x2="880" y2="24"/>
    <line x1="876" y1="20" x2="876" y2="28"/>
    <!-- Bottom Left -->
    <line x1="20" y1="296" x2="28" y2="296"/>
    <line x1="24" y1="292" x2="24" y2="300"/>
    <!-- Bottom Right -->
    <line x1="872" y1="296" x2="880" y2="296"/>
    <line x1="876" y1="292" x2="876" y2="300"/>
  </g>

  <!-- Eyebrow Category -->
  <text x="450" y="78" text-anchor="middle" class="eyebrow">// DATA &amp; MLOPS PRACTITIONER</text>

  <!-- Main Name Title -->
  <text x="450" y="130" text-anchor="middle" class="title">JOSHUA REMEDIAL SYEBA</text>

  <!-- Subtitle Disciplines -->
  <text x="450" y="168" text-anchor="middle" class="subtitle">DATA SCIENCE · DATA ENGINEERING · ANALYTICS · MLOPS</text>

  <!-- Minimalist Divider -->
  <line x1="320" y1="198" x2="580" y2="198" stroke="#27272a" stroke-width="1"/>
  <circle cx="450" cy="198" r="2" fill="#71717a"/>

  <!-- Badges / Status Bar Container -->
  <g transform="translate(230, 226)">
    <!-- Pill 1: Open to Work -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="36" rx="8" fill="#121215" stroke="#27272a" stroke-width="1"/>
      <circle cx="20" cy="18" r="4.5" fill="#10b981" filter="url(#emeraldGlow)" class="pulse-dot"/>
      <text x="34" y="22" class="pill-text">OPEN TO WORK</text>
    </g>

    <!-- Pill 2: Scope -->
    <g transform="translate(192, 0)">
      <rect x="0" y="0" width="248" height="36" rx="8" fill="#121215" stroke="#27272a" stroke-width="1"/>
      <text x="16" y="22" class="meta-text">END-TO-END DATA LIFECYCLE</text>
    </g>
  </g>
</svg>
