<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  .title { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; font-size: 30px; letter-spacing: 6px; fill: #00f0ff; }
  .cat { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 3px; }
  .pill-text { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; font-size: 13px; }
  .trace { fill: none; stroke-width: 2; stroke-linecap: round; animation: travel 3.2s linear infinite; }
  @keyframes travel { to { stroke-dashoffset: -400; } }
  .glowbar { animation: pulse 2.6s ease-in-out infinite; }
  .ring { animation: pulse 2.6s ease-in-out infinite; }
  .corner { stroke: #00f0ff; stroke-width: 2.5; fill: none; opacity: .9; }
  .grid { stroke: #00f0ff; stroke-opacity: .05; stroke-width: 1; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  @keyframes drift { 0% { transform: translateX(0); } 50% { transform: translateX(14px); } 100% { transform: translateX(0); } }
  @keyframes glitch { 0%, 92%, 100% { transform: translate(0,0); opacity: 0; } 93% { transform: translate(-3px,1px); opacity: .8; } 95% { transform: translate(3px,-1px); opacity: .8; } 97% { transform: translate(-2px,0); opacity: .6; } }
  @keyframes scan { 0% { transform: translateY(-40px); } 100% { transform: translateY(640px); } }
  .ember { animation: rise linear infinite; }
  @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: .9; } 90% { opacity: .5; } 100% { transform: translateY(-560px); opacity: 0; } }
</style>

<radialGradient id="bgGrad" cx="50%" cy="15%" r="90%">
  <stop offset="0%" stop-color="#0a192f"/>
  <stop offset="45%" stop-color="#030c1b"/>
  <stop offset="100%" stop-color="#010610"/>
</radialGradient>

<radialGradient id="vignette" cx="50%" cy="50%" r="75%">
  <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
  <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
</radialGradient>

<linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#00f0ff"><animate attributeName="stop-color" values="#00f0ff;#f72585;#ffb703;#00f0ff" dur="8s" repeatCount="indefinite"/></stop>
  <stop offset="100%" stop-color="#f72585"><animate attributeName="stop-color" values="#f72585;#ffb703;#00f0ff;#f72585" dur="8s" repeatCount="indefinite"/></stop>
</linearGradient>

<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="4" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="8" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.1"/>
  <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="900" height="600" rx="18" fill="url(#bgGrad)"/>
<rect x="0" y="0" width="900" height="600" rx="18" fill="url(#vignette)"/>

<g clip-path="none">
  <g style="animation: drift 12s ease-in-out infinite;">
    <line class="grid" x1="0" y1="60" x2="900" y2="60"/>
    <line class="grid" x1="0" y1="180" x2="900" y2="180"/>
    <line class="grid" x1="0" y1="300" x2="900" y2="300"/>
    <line class="grid" x1="0" y1="420" x2="900" y2="420"/>
    <line class="grid" x1="0" y1="540" x2="900" y2="540"/>
  </g>
</g>

<rect x="3" y="3" width="894" height="594" rx="16" fill="none" stroke="url(#frameGrad)" stroke-width="5" opacity="0.25" filter="url(#softglow)"/>
<rect x="3" y="3" width="894" height="594" rx="16" fill="none" stroke="url(#frameGrad)" stroke-width="2.2" opacity="0.75"/>

<path class="corner" stroke="#00f0ff" stroke-width="2.5" fill="none" opacity=".9" d="M24 60 L24 24 L60 24"/>
<path class="corner" stroke="#00f0ff" stroke-width="2.5" fill="none" opacity=".9" d="M876 60 L876 24 L840 24"/>
<path class="corner" stroke="#00f0ff" stroke-width="2.5" fill="none" opacity=".9" d="M24 540 L24 576 L60 576"/>
<path class="corner" stroke="#00f0ff" stroke-width="2.5" fill="none" opacity=".9" d="M876 540 L876 576 L840 576"/>

<text x="450" y="58" text-anchor="middle" class="title" fill="#00f0ff" filter="url(#softglow)">TECH STACK</text>
<rect class="glowbar" x="350" y="72" width="200" height="2.5" fill="#ffb703" filter="url(#glow)"/>
<text x="447" y="58" text-anchor="middle" class="title" fill="#00f0ff" style="animation: glitch 6s infinite; opacity:0;">TECH STACK</text>
<text x="453" y="58" text-anchor="middle" class="title" fill="#f72585" style="animation: glitch 6s infinite .1s; opacity:0;">TECH STACK</text>
<rect x="0" y="0" width="900" height="40" fill="url(#scanGrad)" style="animation: scan 5s linear infinite;"/>

