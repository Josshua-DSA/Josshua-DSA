<svg width="900" height="510" viewBox="0 0 900 510" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Card Background Gradient -->
    <radialGradient id="stackBg" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="45%" stop-color="#0e0e11"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>

    <!-- Subtle Dot Grid -->
    <pattern id="skillGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#71717a" fill-opacity="0.10"/>
    </pattern>

    <!-- Top Shimmer Gradient -->
    <linearGradient id="cardTopGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#71717a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.2"/>
    </linearGradient>

    <style>
      .section-eyebrow {
        font-family: 'JetBrains Mono', 'Geist Mono', monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 3px;
        fill: #a1a1aa;
      }
      .section-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Geist', sans-serif;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 2px;
        fill: #ffffff;
      }
      .card-header {
        font-family: 'JetBrains Mono', 'Geist Mono', monospace;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #f4f4f5;
      }
      .pill-bg {
        fill: #18181b;
        stroke: #27272a;
        stroke-width: 1;
        transition: all 0.2s ease;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.5px;
        fill: #d4d4d8;
      }
    </style>
  </defs>

  <!-- Container Base -->
  <rect x="0" y="0" width="900" height="510" rx="14" fill="url(#stackBg)"/>
  <rect x="0" y="0" width="900" height="510" rx="14" fill="url(#skillGrid)"/>
  <rect x="1" y="1" width="898" height="508" rx="13" fill="none" stroke="#27272a" stroke-width="1"/>

  <!-- Top Ambient Shimmer Border -->
  <path d="M 14 1 L 886 1" stroke="url(#cardTopGlow)" stroke-width="1.2"/>

  <!-- Section Header -->
  <text x="450" y="44" text-anchor="middle" class="section-eyebrow">// ARCHITECTURE &amp; TOOLING</text>
  <text x="450" y="74" text-anchor="middle" class="section-title">TECHNICAL ECOSYSTEM</text>
  <line x1="410" y1="86" x2="490" y2="86" stroke="#27272a" stroke-width="1"/>

  <!-- ==================== CARD 1: DATA ANALYSIS & VIZ ==================== -->
  <g transform="translate(24, 106)">
    <rect x="0" y="0" width="420" height="180" rx="10" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="20" y="32" class="card-header">01 // DATA ANALYSIS &amp; VISUALIZATION</text>
    <line x1="20" y1="44" x2="400" y2="44" stroke="#27272a" stroke-width="1"/>
    
    <!-- Row 1 -->
    <g transform="translate(20, 60)">
      <rect class="pill-bg" x="0" y="0" width="88" height="30" rx="6"/>
      <text class="pill-text" x="44" y="19" text-anchor="middle">Power BI</text>

      <rect class="pill-bg" x="96" y="0" width="82" height="30" rx="6"/>
      <text class="pill-text" x="137" y="19" text-anchor="middle">Tableau</text>

      <rect class="pill-bg" x="186" y="0" width="118" height="30" rx="6"/>
      <text class="pill-text" x="245" y="19" text-anchor="middle">Looker Studio</text>

      <rect class="pill-bg" x="312" y="0" width="68" height="30" rx="6"/>
      <text class="pill-text" x="346" y="19" text-anchor="middle">D3.js</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(20, 102)">
      <rect class="pill-bg" x="0" y="0" width="110" height="30" rx="6"/>
      <text class="pill-text" x="55" y="19" text-anchor="middle">SQL Analytics</text>

      <rect class="pill-bg" x="118" y="0" width="160" height="30" rx="6"/>
      <text class="pill-text" x="198" y="19" text-anchor="middle">Exploratory Analysis</text>

      <rect class="pill-bg" x="286" y="0" width="94" height="30" rx="6"/>
      <text class="pill-text" x="333" y="19" text-anchor="middle">Dashboarding</text>
    </g>
  </g>

  <!-- ==================== CARD 2: DATA SCIENCE & ML ==================== -->
  <g transform="translate(456, 106)">
    <rect x="0" y="0" width="420" height="180" rx="10" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="20" y="32" class="card-header">02 // DATA SCIENCE &amp; ML</text>
    <line x1="20" y1="44" x2="400" y2="44" stroke="#27272a" stroke-width="1"/>
    
    <!-- Row 1 -->
    <g transform="translate(20, 60)">
      <rect class="pill-bg" x="0" y="0" width="76" height="30" rx="6"/>
      <text class="pill-text" x="38" y="19" text-anchor="middle">Python</text>

      <rect class="pill-bg" x="84" y="0" width="44" height="30" rx="6"/>
      <text class="pill-text" x="106" y="19" text-anchor="middle">R</text>

      <rect class="pill-bg" x="136" y="0" width="78" height="30" rx="6"/>
      <text class="pill-text" x="175" y="19" text-anchor="middle">Pandas</text>

      <rect class="pill-bg" x="222" y="0" width="76" height="30" rx="6"/>
      <text class="pill-text" x="260" y="19" text-anchor="middle">NumPy</text>

      <rect class="pill-bg" x="306" y="0" width="74" height="30" rx="6"/>
      <text class="pill-text" x="343" y="19" text-anchor="middle">SciPy</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(20, 102)">
      <rect class="pill-bg" x="0" y="0" width="108" height="30" rx="6"/>
      <text class="pill-text" x="54" y="19" text-anchor="middle">Scikit-Learn</text>

      <rect class="pill-bg" x="116" y="0" width="154" height="30" rx="6"/>
      <text class="pill-text" x="193" y="19" text-anchor="middle">Statistical Modeling</text>

      <rect class="pill-bg" x="278" y="0" width="102" height="30" rx="6"/>
      <text class="pill-text" x="329" y="19" text-anchor="middle">XGBoost</text>
    </g>
  </g>

  <!-- ==================== CARD 3: DATA ENGINEERING & BIG DATA ==================== -->
  <g transform="translate(24, 302)">
    <rect x="0" y="0" width="420" height="180" rx="10" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="20" y="32" class="card-header">03 // DATA ENGINEERING &amp; BIG DATA</text>
    <line x1="20" y1="44" x2="400" y2="44" stroke="#27272a" stroke-width="1"/>
    
    <!-- Row 1 -->
    <g transform="translate(20, 60)">
      <rect class="pill-bg" x="0" y="0" width="102" height="30" rx="6"/>
      <text class="pill-text" x="51" y="19" text-anchor="middle">PostgreSQL</text>

      <rect class="pill-bg" x="110" y="0" width="76" height="30" rx="6"/>
      <text class="pill-text" x="148" y="19" text-anchor="middle">MySQL</text>

      <rect class="pill-bg" x="194" y="0" width="94" height="30" rx="6"/>
      <text class="pill-text" x="241" y="19" text-anchor="middle">MongoDB</text>

      <rect class="pill-bg" x="296" y="0" width="84" height="30" rx="6"/>
      <text class="pill-text" x="338" y="19" text-anchor="middle">SQLite</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(20, 102)">
      <rect class="pill-bg" x="0" y="0" width="118" height="30" rx="6"/>
      <text class="pill-text" x="59" y="19" text-anchor="middle">Apache Spark</text>

      <rect class="pill-bg" x="126" y="0" width="82" height="30" rx="6"/>
      <text class="pill-text" x="167" y="19" text-anchor="middle">Hadoop</text>

      <rect class="pill-bg" x="216" y="0" width="72" height="30" rx="6"/>
      <text class="pill-text" x="252" y="19" text-anchor="middle">Flume</text>

      <rect class="pill-bg" x="296" y="0" width="84" height="30" rx="6"/>
      <text class="pill-text" x="338" y="19" text-anchor="middle">ETL / ELT</text>
    </g>
  </g>

  <!-- ==================== CARD 4: MLOPS & DEEP LEARNING ==================== -->
  <g transform="translate(456, 302)">
    <rect x="0" y="0" width="420" height="180" rx="10" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="20" y="32" class="card-header">04 // MLOPS &amp; DEEP LEARNING</text>
    <line x1="20" y1="44" x2="400" y2="44" stroke="#27272a" stroke-width="1"/>
    
    <!-- Row 1 -->
    <g transform="translate(20, 60)">
      <rect class="pill-bg" x="0" y="0" width="82" height="30" rx="6"/>
      <text class="pill-text" x="41" y="19" text-anchor="middle">PyTorch</text>

      <rect class="pill-bg" x="90" y="0" width="102" height="30" rx="6"/>
      <text class="pill-text" x="141" y="19" text-anchor="middle">TensorFlow</text>

      <rect class="pill-bg" x="200" y="0" width="92" height="30" rx="6"/>
      <text class="pill-text" x="246" y="19" text-anchor="middle">Lightning</text>

      <rect class="pill-bg" x="300" y="0" width="80" height="30" rx="6"/>
      <text class="pill-text" x="340" y="19" text-anchor="middle">W&amp;B</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(20, 102)">
      <rect class="pill-bg" x="0" y="0" width="78" height="30" rx="6"/>
      <text class="pill-text" x="39" y="19" text-anchor="middle">MLflow</text>

      <rect class="pill-bg" x="86" y="0" width="60" height="30" rx="6"/>
      <text class="pill-text" x="116" y="19" text-anchor="middle">DVC</text>

      <rect class="pill-bg" x="154" y="0" width="94" height="30" rx="6"/>
      <text class="pill-text" x="201" y="19" text-anchor="middle">DagsHub</text>

      <rect class="pill-bg" x="256" y="0" width="124" height="30" rx="6"/>
      <text class="pill-text" x="318" y="19" text-anchor="middle">CI/CD Pipelines</text>
    </g>
  </g>
</svg>
